<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #111;
    }
    .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .logo {
      background: #ffd43b; border-radius: 6px; width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .title { font-weight: 800; font-size: 16px; }
    p { margin: 6px 0; color: #495057; line-height: 1.45; }
    b { color: #111; }
    a { color: #1971c2; text-decoration: none; }
  </style>
</head>
<body>
  <div class="head">
    <span class="logo">⇅</span>
    <span class="title">Outlier</span>
  </div>
  <p>Open any Instagram profile's <b>Reels tab</b> — the Outlier panel appears top-right.</p>
  <p>Pick a filter and a sort criterion, then hit <b>Sort</b>. Tile #1 is the top reel.</p>
  <p><a href="https://github.com/YatharthPnwr/outlier" target="_blank">Help &amp; source ↗</a></p>
</body>
</html>
